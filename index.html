<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFD93D"><title>晓的工作台</title><style>:root{--bg:#fff6c9;--panel:#fffdf5;--line:#ead77c;--ink:#493b1b;--muted:#8d7c50;--accent:#eaa900;--soft:#fff0a6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:78px}.top{position:sticky;top:0;z-index:20;height:58px;background:#ffe276;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px}.top b{flex:1;font-size:17px}.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--accent);color:#fff;font-weight:700}.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}.danger{background:#d9534f}main{max-width:760px;margin:auto;padding:15px}.hero{font-size:24px;font-weight:800;margin:5px 0}.date,.small{color:var(--muted);font-size:12px}.date{margin-bottom:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #a9842414}h3{font-size:16px;margin:0 0 11px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary .card{text-align:center;margin:0;padding:12px 4px}.num{font-size:19px;font-weight:800}.task{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f0e5a8}.task:last-child{border:0}.task input{width:20px;height:20px;accent-color:var(--accent)}.task.done .txt{text-decoration:line-through;color:#aaa}.txt{flex:1}.tag{font-size:11px;background:var(--soft);border-radius:99px;padding:3px 7px}.progress{height:8px;background:#f5e8a5;border-radius:8px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--accent)}.section{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;color:var(--ink)}.section strong{font-size:16px}.section .small{margin-top:5px}.subgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.sub{background:#fff9dc;border:1px solid #efdc83;border-radius:12px;padding:11px;text-align:center}.sub b{display:block;font-size:13px;margin-top:4px}.tree{position:relative;padding-left:14px;margin:8px 0}.tree:before{content:'';position:absolute;left:3px;top:0;bottom:0;border-left:2px solid #efc94f}.node{background:#fff9df;border:1px solid #efdc83;border-radius:12px;padding:11px;margin:8px 0}.nodeHead{display:flex;gap:8px;align-items:center}.nodeHead .txt{font-weight:700}.nodeActions{display:flex;gap:5px}.mini{border:1px solid var(--line);background:#fffdf5;border-radius:8px;padding:5px 8px;color:var(--ink)}.bottom{position:fixed;bottom:0;left:0;right:0;height:68px;background:var(--panel);border-top:1px solid var(--line);display:flex;z-index:20}.nav{flex:1;text-align:center;padding:8px 2px;font-size:11px;color:var(--muted)}.nav span{display:block;font-size:21px}.nav.active{color:#956c00;font-weight:800}.page{display:none}.page.active{display:block}.modalBg{position:fixed;inset:0;background:#0005;z-index:50;display:none;align-items:flex-end}.modalBg.show{display:flex}.modal{background:var(--panel);width:100%;max-width:760px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:84vh;overflow:auto}.modal input,.modal select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:5px 0 10px;background:#fff}.row{display:flex;gap:8px}.row>*{flex:1}.editRow{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid #eee}.editRow .txt{font-weight:600}@media(min-width:700px){.modalBg{align-items:center}.modal{max-width:520px;border-radius:20px}.bottom{left:50%;transform:translateX(-50%);max-width:760px}}</style></head><body><header class="top"><b>🐱 晓的工作台</b><button class="btn ghost" onclick="openModuleEditor()">⚙ 编辑</button></header><main><section id="today" class="page active"><div class="hero" id="hello"></div><div class="date" id="todayDate"></div><div class="summary"><div class="card"><div class="num" id="studyCount"></div><div class="small">学习</div></div><div class="card"><div class="num" id="healthCount"></div><div class="small">健康</div></div><div class="card"><div class="num" id="lifeCount"></div><div class="small">生活</div></div></div><div style="height:11px"></div><div class="card"><h3>☀️ 今日任务</h3><div id="todayTasks"></div><button class="btn ghost" style="width:100%;margin-top:9px" onclick="openTask()">＋ 添加任务</button></div><div class="card"><h3>🎯 当前学习计划</h3><div id="todayPlan"></div></div><div class="card"><h3>📰 公务员 · 今日时政</h3><div class="small">时政数据源接入后，这里每天自动更新重要时政、考点、原始来源和练习题。</div><div style="margin-top:10px"><span class="tag">国内时政</span> <span class="tag">政策</span> <span class="tag">科技</span> <span class="tag">民生</span></div></div></section><section id="areas" class="page"><div class="hero">我的领域</div><div class="date">进入领域后可以继续查看子模块。</div><div id="moduleList"></div><button class="btn" style="width:100%" onclick="addModule()">＋ 添加一级模块</button></section><section id="plans" class="page"><div class="hero">关联计划</div><div class="date">一个月目标可以拆成多周，每周继续拆到每天和具体知识点。</div><div id="planTree"></div><button class="btn" style="width:100%" onclick="addPlan(null,'month')">＋ 新建月计划</button></section><section id="stats" class="page"><div class="hero">我的统计</div><div class="date">任务完成后自动累计。</div><div class="card"><h3>今日完成度</h3><div id="statsText"></div><div class="progress"><div id="allFill" class="fill"></div></div></div><div class="card"><h3>学习方向</h3><div id="studyStats"></div></div></section></main><nav class="bottom"><div class="nav active" data-page="today" onclick="go(this)"><span>🏠</span>今日</div><div class="nav" data-page="areas" onclick="go(this)"><span>🧩</span>领域</div><div class="nav" data-page="plans" onclick="go(this)"><span>🎯</span>计划</div><div class="nav" data-page="stats" onclick="go(this)"><span>📊</span>统计</div></nav><div id="modalBg" class="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><script>const KEY='xiao_workbench_v2';const defaults={modules:[{id:'study',parent:null,icon:'📚',name:'学习',desc:'公务员 · 教师编 · 心理学'},{id:'civil',parent:'study',icon:'🏛️',name:'公务员',desc:'行测 · 申论 · 时政'},{id:'teacher',parent:'study',icon:'🏫',name:'教师编',desc:'教综 · 背诵 · 刷题 · 错题'},{id:'psy',parent:'study',icon:'🧠',name:'心理学',desc:'专业知识 · 阅读 · 文献 · 笔记'},{id:'health',parent:null,icon:'❤️',name:'健康',desc:'睡眠 · 运动 · 饮水 · 每日状态'},{id:'life',parent:null,icon:'🌿',name:'生活',desc:'日程 · 待办 · 习惯 · 日记'}],tasks:[{id:1,area:'teacher',text:'教综：复习感觉与知觉',done:false},{id:2,area:'civil',text:'行测：判断推理 30 题',done:false},{id:3,area:'health',text:'运动 30 分钟',done:false},{id:4,area:'life',text:'整理今天的待办',done:false}],plans:[{id:101,parent:null,level:'month',title:'教综：完成心理学部分'},{id:102,parent:101,level:'week',title:'第1周：普通心理学第1～3章'},{id:103,parent:102,level:'day',title:'今天：感觉、知觉、注意'}]};let data=JSON.parse(localStorage.getItem(KEY)||'null')||defaults;function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function children(id){return data.modules.filter(m=>m.parent===id)}function moduleName(id){let m=data.modules.find(x=>x.id===id);return m?m.name:'其他'}function rootOf(id){let m=data.modules.find(x=>x.id===id);while(m&&m.parent)m=data.modules.find(x=>x.id===m.parent);return m?.id||id}function render(){let h=new Date().getHours();hello.textContent=(h<6?'夜深了':h<11?'早上好':h<14?'中午好':h<18?'下午好':'晚上好')+'，晓';todayDate.textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});todayTasks.innerHTML=data.tasks.length?data.tasks.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})"><div class="txt">${esc(t.text)}</div><span class="tag">${esc(moduleName(t.area))}</span></div>`).join(''):'<div class="small">今天还没有任务。</div>';['study','health','life'].forEach(a=>{let ts=data.tasks.filter(t=>rootOf(t.area)===a),d=ts.filter(t=>t.done).length;document.getElementById(a+'Count').textContent=d+'/'+ts.length});let roots=data.modules.filter(m=>!m.parent);moduleList.innerHTML=roots.map(m=>{let cs=children(m.id);return `<button class="section" onclick="openArea('${m.id}')"><strong>${esc(m.icon)} ${esc(m.name)}</strong><div class="small">${esc(m.desc)}</div>${cs.length?`<div class="subgrid">${cs.map(c=>`<div class="sub">${esc(c.icon)}<b>${esc(c.name)}</b></div>`).join('')}</div>`:''}</button>`}).join('');renderPlans();let done=data.tasks.filter(t=>t.done).length,total=data.tasks.length,p=total?Math.round(done/total*100):0;statsText.textContent=`完成 ${done}/${total} 项，${p}%`;allFill.style.width=p+'%';let ss=children('study');studyStats.innerHTML=ss.map(m=>{let ts=data.tasks.filter(t=>t.area===m.id),d=ts.filter(t=>t.done).length,q=ts.length?Math.round(d/ts.length*100):0;return `<div class="task"><div class="txt">${m.icon} ${esc(m.name)}</div><b>${q}%</b></div>`}).join('')}function renderPlans(){let months=data.plans.filter(p=>p.level==='month');planTree.innerHTML=months.length?months.map(p=>planHTML(p,0)).join(''):'<div class="card small">还没有月计划。</div>';let first=months[0];todayPlan.innerHTML=first?simplePlan(first):'<div class="small">还没有学习计划。</div>'}function simplePlan(p){let ws=data.plans.filter(x=>x.parent===p.id),w=ws[0],ds=w?data.plans.filter(x=>x.parent===w.id):[],d=ds[0];return `<div class="node"><b>本月</b><div>${esc(p.title)}</div></div>${w?`<div class="node"><b>本周</b><div>${esc(w.title)}</div></div>`:''}${d?`<div class="node"><b>今日</b><div>${esc(d.title)}</div></div>`:''}`}function planHTML(p,depth){let cs=data.plans.filter(x=>x.parent===p.id);let next=p.level==='month'?'week':p.level==='week'?'day':'task';let labels={month:'月计划',week:'周计划',day:'日计划',task:'知识点'};return `<div class="tree"><div class="node"><div class="nodeHead"><div class="txt"><span class="tag">${labels[p.level]}</span> ${esc(p.title)}</div><div class="nodeActions"><button class="mini" onclick="event.stopPropagation();editPlan(${p.id})">✎</button><button class="mini" onclick="event.stopPropagation();deletePlan(${p.id})">×</button></div></div>${p.level!=='task'?`<button class="mini" style="margin-top:8px" onclick="addPlan(${p.id},'${next}')">＋ 拆分${labels[next]}</button>`:''}</div>${cs.map(c=>planHTML(c,depth+1)).join('')}</div>`}function toggleTask(id){let t=data.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save()}function go(el){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(el.dataset.page).classList.add('active')}function showModal(html){modal.innerHTML=html;modalBg.classList.add('show')}function closeModal(){modalBg.classList.remove('show')}function openTask(area='civil'){showModal(`<h3>添加今日任务</h3><label class="small">任务内容</label><input id="taskText" placeholder="今天要完成什么？"><label class="small">所属模块</label><select id="taskArea">${data.modules.filter(m=>m.id!=='study').map(m=>`<option value="${m.id}" ${m.id===area?'selected':''}>${esc(m.icon+' '+m.name)}</option>`).join('')}</select><div class="row"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="addTaskNow()">保存</button></div>`)}function addTaskNow(){let v=taskText.value.trim();if(!v)return;data.tasks.push({id:Date.now(),area:taskArea.value,text:v,done:false});save();closeModal()}function openArea(id){let m=data.modules.find(x=>x.id===id),cs=children(id);if(cs.length){showModal(`<h3>${m.icon} ${esc(m.name)}</h3><div class="small">${esc(m.desc)}</div><div style="margin-top:12px">${cs.map(c=>`<button class="section" onclick="openArea('${c.id}')"><strong>${c.icon} ${esc(c.name)}</strong><div class="small">${esc(c.desc)}</div></button>`).join('')}</div><button class="btn ghost" style="width:100%" onclick="addChildModule('${id}')">＋ 添加子模块</button>`);return}let ts=data.tasks.filter(t=>t.area===id);showModal(`<h3>${m.icon} ${esc(m.name)}</h3><div class="small">${esc(m.desc)}</div><div style="margin:12px 0">${ts.length?ts.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id});openArea('${id}')"><div class="txt">${esc(t.text)}</div></div>`).join(''):'<div class="small">暂无任务</div>'}</div><button class="btn" style="width:100%" onclick="closeModal();openTask('${id}')">＋ 添加任务</button>`)}function addPlan(parent,level){let label={month:'月计划',week:'周计划',day:'日计划',task:'知识点'}[level];showModal(`<h3>新建${label}</h3><input id="planTitle" placeholder="输入${label}内容"><div class="row"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="savePlan(${parent===null?'null':parent},'${level}')">保存</button></div>`)}function savePlan(parent,level){let v=planTitle.value.trim();if(!v)return;data.plans.push({id:Date.now(),parent,level,title:v});save();closeModal()}function editPlan(id){let p=data.plans.find(x=>x.id===id);let n=prompt('修改计划',p.title);if(n&&n.trim()){p.title=n.trim();save()}}function deletePlan(id){if(!confirm('删除这项计划及它下面的所有计划？'))return;let ids=[id],changed=true;while(changed){changed=false;data.plans.forEach(p=>{if(ids.includes(p.parent)&&!ids.includes(p.id)){ids.push(p.id);changed=true}})}data.plans=data.plans.filter(p=>!ids.includes(p.id));save()}function addModule(){moduleForm(null)}function addChildModule(parent){moduleForm(parent)}function moduleForm(parent){showModal(`<h3>${parent?'添加子模块':'添加一级模块'}</h3><label class="small">图标</label><input id="mi" value="✨"><label class="small">名称</label><input id="mn" placeholder="模块名称"><label class="small">说明</label><input id="md" placeholder="用途或子栏目"><div class="row"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveModule('${parent||''}')">添加</button></div>`)}function saveModule(parent){if(!mn.value.trim())return;data.modules.push({id:'m'+Date.now(),parent:parent||null,icon:mi.value||'✨',name:mn.value.trim(),desc:md.value.trim()});save();closeModal()}function openModuleEditor(){showModal(`<h3>编辑工作台</h3><div class="small">模块可以改名、排序和添加子模块。</div>${data.modules.map((m,i)=>`<div class="editRow"><div class="txt">${m.icon} ${esc(m.name)} <span class="small">${m.parent?'子模块':''}</span></div><button class="mini" onclick="renameModule(${i})">改名</button><button class="mini" onclick="moveModule(${i},-1)">↑</button><button class="mini" onclick="moveModule(${i},1)">↓</button></div>`).join('')}<button class="btn" style="width:100%;margin-top:10px" onclick="closeModal();addModule()">＋ 添加模块</button>`)}function renameModule(i){let n=prompt('新的模块名称',data.modules[i].name);if(n&&n.trim()){data.modules[i].name=n.trim();save();openModuleEditor()}}function moveModule(i,d){let j=i+d;if(j<0||j>=data.modules.length)return;[data.modules[i],data.modules[j]]=[data.modules[j],data.modules[i]];save();openModuleEditor()}render()</script></body></html>
