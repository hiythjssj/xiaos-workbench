<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD93D">
<title>晓的工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#fff4c2;color:#4a3b1a}.top{position:sticky;top:0;background:#ffe17a;padding:14px 16px;border-bottom:1px solid #e8d57a;font-weight:800;font-size:18px}.wrap{max-width:760px;margin:auto;padding:16px}.hello{font-size:26px;font-weight:800;margin:8px 0}.sub{color:#7a6a45;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#fffdf5;border:1px solid #e8d57a;border-radius:16px;padding:16px;box-shadow:0 2px 8px #b48c2820}.card h3{margin:0 0 8px}.big{grid-column:1/-1}.progress{height:8px;background:#ffe99a;border-radius:8px;overflow:hidden;margin-top:10px}.progress i{display:block;width:35%;height:100%;background:#f4a900}.item{padding:11px 0;border-bottom:1px solid #f0e5a8}.item:last-child{border:0}.pill{display:inline-block;background:#ffe99a;padding:4px 9px;border-radius:99px;font-size:12px;margin-right:5px}.foot{text-align:center;color:#a89968;font-size:12px;padding:25px}.edit{float:right;border:1px solid #d9bf55;background:#fffdf5;border-radius:10px;padding:6px 10px;color:#4a3b1a}@media(max-width:600px){.grid{grid-template-columns:1fr}.big{grid-column:auto}.hello{font-size:23px}}
</style>
</head>
<body>
<div class="top">🐱 晓的工作台 <button class="edit" onclick="alert('下一版加入动态模块编辑、拖拽排序和云同步')">编辑</button></div>
<main class="wrap">
<div class="hello">今天也好好生活</div><div class="sub">好好生活，认真学习，照顾自己。</div>
<div class="grid">
<section class="card"><h3>📚 学习</h3><div>公务员 · 教师编 · 心理学</div><div class="progress"><i></i></div></section>
<section class="card"><h3>❤️ 健康</h3><div>睡眠 · 运动 · 饮水 · 每日状态</div></section>
<section class="card"><h3>🌿 生活</h3><div>日程 · 待办 · 习惯 · 日记</div></section>
<section class="card big"><h3>🎯 月 → 周 → 日计划</h3><div class="item"><b>本月</b>　教综：完成心理学部分 <span class="pill">35%</span></div><div class="item"><b>本周</b>　普通心理学：第 1～3 章</div><div class="item"><b>今天</b>　感觉、知觉、注意</div></section>
<section class="card big"><h3>📰 公务员 · 今日时政</h3><div class="item">每日时政自动收集模块将在后续接入数据源</div><div><span class="pill">国内时政</span><span class="pill">政策</span><span class="pill">科技</span><span class="pill">民生</span></div></section>
<section class="card big"><h3>🧩 动态工作台</h3><div>后续支持模块增删、改名、隐藏、归档、拖拽排序，以及自定义生活、健康、学习的子栏目。</div></section>
</div>
<div class="foot">晓的工作台 · Mobile Web</div>
</main>
</body></html>
