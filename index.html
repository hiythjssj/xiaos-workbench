p(m=>moduleCard(m,true)).join('');otherModules.innerHTML=data.modules.filter(m=>!m.parent&&m.id!=='study'&&m.visible!==false).map(m=>moduleCard(m,true)).join('');renderPlans();cloudBtn.textContent=auth?.access_token?'☁ 已登录':'☁ 未登录'}function renderDashboard(){let cards={summary:summaryCard(),tasks:tasksCard(),plans:todayPlanCard()};dashboard.innerHTML=(data.dashboard||D.dashboard).filter(k=>k!=='current').map(k=>cards[k]||'').join('')}function summaryCard(){let count=a=>{let x=data.tasks.filter(t=>root(t.area)===a);return x.filter(t=>t.done).length+'/'+x.length};return `<div class="summary"><div class="card"><div class="num">${count('study')}</div><small>学习</small></div><div class="card"><div class="num">${count('health')}</div><small>健康</small></div><div class="card"><div class="num">${count('life')}</div><small>生活</small></div></div><div style="height:11px"></div>`}function tasksCard(){return `<div class="card"><h3>☀️ 今日任务</h3>${data.tasks.length?data.tasks.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${t.id})"><div class="txt">${e(t.text)}${t.planId?'<div class="muted" style="margin:2px 0 0">已关联计划</div>':''}</div><span class="tag">${e(mod(t.area)?.name||'其他')}</span></div>`).join(''):'<div class="muted">今天还没有任务。</div>'}<button class="mini" style="width:100%;margin-top:8px" onclick="taskForm()">＋ 添加今日任务</button></div>`}function todayPlanCard(){let active=data.plans.find(p=>p.level==='day');if(!active)return `<div class="card"><h3>🎯 今日关联计划</h3><div class="muted">还没有日计划。</div></div>`;let q=planProgress(active.id);return `<div class="card"><h3>🎯 今日关联计划</h3><div class="node"><div class="head"><div class="txt">${e(active.title)}</div><span class="tag">${q}%</span></div><div class="progress"><div class="fill" style="width:${q}%"></div></div>${data.plans.filter(p=>p.parent===active.id).map(p=>`<div class="task"><div class="txt">${e(p.title)}</div><button class="mini" onclick="makeTask(${p.id})">加入今日</button></div>`).join('')}</div></div>`}function moduleCard(m,deep){let cs=kids(m.id);return `<button class="module" onclick="openModule('${m.id}')"><strong>${e(m.icon)} ${e(m.name)}</strong><div class="muted" style="margin:4px 0 0">${e(m.desc)}</div>${cs.length&&deep?`<div class="chips">${cs.map(c=>`<span class="chip">${e(c.icon)} ${e(c.name)}</span>`).join('')}</div>`:''}</button>`}function renderPlans(){let ms=data.plans.filter(p=>p.level==='month');planTree.innerHTML=ms.length?ms.map(planHTML).join(''):'<div class="card muted">还没有月计划。</div>'}function planHTML(p){let cs=data.plans.filter(x=>x.parent===p.id),labels={month:'月',week:'周',day:'日',task:'知识点'},next={month:'week',week:'day',day:'task'},q=planProgress(p.id);return `<div class="tree"><div class="node"><div class="head"><div class="txt"><span class="tag">${labels[p.level]}</span> ${e(p.title)}</div><span class="tag">${q}%</span><div class="actions"><button class="mini" onclick="editPlan(${p.id})">✎</button><button class="mini" onclick="delPlan(${p.id})">×</button></div></div><div class="progress"><div class="fill" style="width:${q}%"></div></div>${p.level==='task'?`<button class="mini" style="margin-top:7px" onclick="makeTask(${p.id})">＋ 加入今日任务</button>`:''}${cs.map(planHTML).join('')}${next[p.level]?`<button class="mini" style="margin-top:7px" onclick="planForm(${p.id},'${next[p.level]}')">＋ 添加${labels[next[p.level]]}</button>`:''}</div></div>`}function go(el,id){document.querySelectorAll('.page,.nav').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');el.classList.add('on')}function toggle(id){let t=data.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save()}function taskForm(id){let t=data.tasks.find(x=>x.id===id)||{};show(`<h3>${id?'编辑':'添加'}任务</h3><label>所属模块</label><select id="ta">${data.modules.filter(m=>!kids(m.id).length).map(m=>`<option value="${m.id}" ${t.area===m.id?'selected':''}>${e(m.name)}</option>`).join('')}</select><label>任务</label><input id="tt" value="${e(t.text||' eDash(${i},1)">↓</button><button class="mini" onclick="hideDash(${i})">隐藏</button></div>`).join('')}<button class="mini" onclick="resetDash()">恢复默认</button>`)}function moveDash(i,d){let j=i+d;if(j<0||j>=data.dashboard.length)return;[data.dashboard[i],data.dashboard[j]]=[data.dashboard[j],data.dashboard[i]];save();editDashboard()}function hideDash(i){data.dashboard.splice(i,1);save();editDashboard()}function resetDash(){data.dashboard=[...D.dashboard];save();editDashboard()}function moduleForm(parent){show(`<h3>添加领域</h3><input id="mi" placeholder="图标，如 📘"><input id="mn" placeholder="名称"><input id="md" placeholder="说明"><button class="btn" onclick="saveModule('${parent||''}')">保存</button>`)}function saveModule(parent){if(!mn.value.trim())return;data.modules.push({id:'m'+Date.now(),parent:parent||null,icon:mi.value||'📌',name:mn.value.trim(),desc:md.value.trim(),visible:true});save();closeM()}function editModules(){show(`<h3>模块管理</h3>${data.modules.map(m=>`<div class="dragrow ${m.visible===false?'hiddenModule':''}"><span>${e(m.icon)}</span><div class="txt">${e(m.name)}</div><button class="mini" onclick="m.visible=m.visible===false;save();editModules()">${m.visible===false?'显示':'隐藏'}</button></div>`).join('')}`)}function show(h){modal.innerHTML=h;mbg.classList.add('on')}function closeM(){mbg.classList.remove('on')}function accountPanel(){show(`<h3>☁ 云同步</h3><div class="muted">登录后，手机和电脑使用同一份数据。</div>${auth?.access_token?`<div class="card"><b>已登录</b><div class="muted">${e(auth.user?.email||'')}</div><button class="btn" onclick="syncNow()">立即同步</button> <button class="mini" onclick="logout()">退出</button></div>`:`<label>邮箱</label><input id="ae" type="email" placeholder="you@example.com"><label>密码</label><input id="ap" type="password" placeholder="至少 6 位"><div class="row"><button class="btn" onclick="login()">登录</button><button class="mini" onclick="signup()">注册</button></div><div id="amsg" class="muted" style="margin-top:10px">首次注册后即可跨设备同步。</div>`}`)}async function req(path,opt={}){let headers={'apikey':SBKEY,'Content-Type':'application/json',...(opt.headers||{})};if(auth?.access_token)headers.Authorization='Bearer '+auth.access_token;let r=await fetch(SB+path,{...opt,headers});let text=await r.text(),body;try{body=text?JSON.parse(text):null}catch{body=text}if(!r.ok)throw new Error(body?.msg||body?.message||body?.error_description||body?.error||('HTTP '+r.status));return body}async function login(){try{amsg.textContent='登录中…';let x=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:ae.value.trim(),password:ap.value})});auth=x;localStorage.setItem(AUTHK,JSON.stringify(auth));closeM();await pullCloud();render()}catch(err){amsg.textContent='登录失败：'+err.message}}async function signup(){try{amsg.textContent='注册中…';let x=await req('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:ae.value.trim(),password:ap.value})});if(x?.access_token){auth=x;localStorage.setItem(AUTHK,JSON.stringify(auth));await pushCloud();closeM();render()}else amsg.textContent='注册成功，请按邮箱提示完成验证后登录。'}catch(err){amsg.textContent='注册失败：'+err.message}}async function logout(){auth=null;localStorage.removeItem(AUTHK);closeM();render()}function queueCloud(){if(!auth?.access_token)return;clearTimeout(syncTimer);syncTimer=setTimeout(pushCloud,800)}async function pushCloud(){if(!auth?.access_token||syncing)return;syncing=true;try{await req('/rest/v1/workbench_data?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({user_id:auth.user.id,data,updated_at:new Date().toISOString()})});cloudBtn.textContent='☁ 已同步'}catch(e){cloudBtn.textContent='☁ 同步失败'}finally{syncing=false}}async function pullCloud(){if(!auth?.access_token)return;try{let rows=await req('/rest/v1/workbench_data?user_id=eq.'+encodeURIComponent(auth.user.id)+'&select=data,updated_at');if(rows?.[0]?.data){data=rows[0].data;localStorage.setItem(K,JSON.stringify(data))}else await pushCloud()}catch(e){console.warn(e)}}async funct
