<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFD93D"><title>晓的工作台</title><style>:root{--bg:#fff5c4;--card:#fffdf5;--line:#ead77c;--ink:#493b1b;--muted:#8d7c50;--a:#e8a600;--soft:#ffef9b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:76px}header{height:58px;position:sticky;top:0;z-index:9;background:#ffe276;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px}header b{flex:1}.btn,.mini{border:0;border-radius:10px;background:var(--a);color:white;padding:9px 12px;font-weight:700}.mini{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:5px 8px}main{max-width:760px;margin:auto;padding:15px}.page{display:none}.page.on{display:block}.hero{font-size:24px;font-weight:800;margin:5px 0}.muted{font-size:12px;color:var(--muted);margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #98751c14}h3{margin:0 0 11px;font-size:16px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary .card{text-align:center;margin:0;padding:12px 3px}.num{font-size:19px;font-weight:800}.task{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:1px solid #f1e5aa}.task:last-child{border:0}.task input{width:20px;height:20px;accent-color:var(--a)}.task.done .txt{text-decoration:line-through;color:#aaa}.txt{flex:1}.tag{font-size:11px;background:var(--soft);padding:3px 7px;border-radius:99px}.progress{height:8px;background:#f4e6a1;border-radius:8px;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--a)}.module{width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px}.module strong{font-size:16px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{background:#fff8d7;border:1px solid #edd77b;border-radius:10px;padding:7px 9px;font-size:12px}.tree{margin-left:8px;padding-left:12px;border-left:2px solid #efc94f}.node{background:#fff9df;border:1px solid #efdc83;border-radius:12px;padding:11px;margin:8px 0}.head{display:flex;align-items:center;gap:6px}.head .txt{font-weight:700}.actions{display:flex;gap:4px}.bottom{position:fixed;bottom:0;left:0;right:0;height:67px;background:var(--card);border-top:1px solid var(--line);display:flex}.nav{flex:1;text-align:center;padding:8px 1px;font-size:11px;color:var(--muted)}.nav span{display:block;font-size:21px}.nav.on{font-weight:800;color:#916900}.modalbg{display:none;position:fixed;inset:0;background:#0005;z-index:30;align-items:flex-end}.modalbg.on{display:flex}.modal{background:var(--card);width:100%;max-height:85vh;overflow:auto;padding:18px;border-radius:20px 20px 0 0}.modal input,.modal select{width:100%;padding:11px;margin:5px 0 10px;border:1px solid var(--line);border-radius:10px;background:white}.row{display:flex;gap:8px}.row>*{flex:1}@media(min-width:700px){.modalbg{align-items:center}.modal{max-width:520px;margin:auto;border-radius:20px}.bottom{max-width:760px;left:50%;transform:translateX(-50%)}}</style></head><body><header><b>🐱 晓的工作台</b><button class="mini" onclick="editModules()">⚙ 编辑</button></header><main><section id="today" class="page on"><div class="hero" id="hello"></div><div class="muted" id="date"></div><div class="summary"><div class="card"><div class="num" id="sc"></div><small>学习</small></div><div class="card"><div class="num" id="hc"></div><small>健康</small></div><div class="card"><div class="num" id="lc"></div><small>生活</small></div></div><div style="height:11px"></div><div class="card"><h3>☀️ 今日任务</h3><div id="tasks"></div><button class="mini" style="width:100%;margin-top:8px" onclick="taskForm()">＋ 添加今日任务</button></div><div class="card"><h3>🎯 今日关联计划</h3><div id="todayPlans"></div></div><div class="card"><h3>📰 公务员 · 今日时政</h3><div class="muted">下一阶段接入自动时政数据源。将显示事件摘要、考点、来源、收藏和每日练习。</div><div class="chips"><span class="chip">国内时政</span><span class="chip">政策</span><span class="chip">科技</span><span class="chip">民生</span></div></div></section><section id="study" class="page"><div class="hero">学习</div><div class="muted">公务员、教师编、心理学三个方向分别管理。</div><div id="studyModules"></div></section><section id="plans" class="page"><div class="hero">关联计划</div><div class="muted">月目标可以拆到周、日和知识点，知识点可直接生成今日任务。</div><div id="planTree"></div><button class="btn" style="width:100%" onclick="planForm(null,'month')">＋ 新建月计划</button></section><section id="more" class="page"><div class="hero">生活与健康</div><div class="muted">这里保留生活、健康以及以后新增的一级领域。</div><div id="otherModules"></div><button class="btn" style="width:100%" onclick="moduleForm(null)">＋ 添加领域</button></section></main><nav class="bottom"><div class="nav on" onclick="go(this,'today')"><span>🏠</span>今日</div><div class="nav" onclick="go(this,'study')"><span>📚</span>学习</div><div class="nav" onclick="go(this,'plans')"><span>🎯</span>计划</div><div class="nav" onclick="go(this,'more')"><span>🌿</span>生活健康</div></nav><div id="mbg" class="modalbg" onclick="if(event.target===this)closeM()"><div id="modal" class="modal"></div></div><script>const K='xiao_workbench_v3',old=JSON.parse(localStorage.getItem('xiao_workbench_v2')||'null');const D={modules:[{id:'study',parent:null,icon:'📚',name:'学习',desc:'公务员 · 教师编 · 心理学'},{id:'civil',parent:'study',icon:'🏛️',name:'公务员',desc:'时政 · 行测 · 申论 · 错题 · 模考'},{id:'current',parent:'civil',icon:'📰',name:'今日时政',desc:'每日重点时政与考点'},{id:'xingce',parent:'civil',icon:'✏️',name:'行测',desc:'言语 · 判断 · 数量 · 资料 · 常识'},{id:'shenlun',parent:'civil',icon:'📝',name:'申论',desc:'小题 · 大作文 · 素材积累'},{id:'errors',parent:'civil',icon:'📕',name:'错题',desc:'错题复习与归因'},{id:'mock',parent:'civil',icon:'📊',name:'模考',desc:'成绩与模块分析'},{id:'teacher',parent:'study',icon:'🏫',name:'教师编',desc:'教综 · 背诵 · 刷题 · 错题'},{id:'psy',parent:'study',icon:'🧠',name:'心理学',desc:'专业知识 · 书籍 · 文献 · 笔记'},{id:'health',parent:null,icon:'❤️',name:'健康',desc:'睡眠 · 运动 · 饮水 · 每日状态'},{id:'life',parent:null,icon:'🌿',name:'生活',desc:'日程 · 待办 · 习惯 · 日记'}],tasks:[{id:1,area:'teacher',text:'教综：复习感觉与知觉',done:false,planId:104},{id:2,area:'xingce',text:'判断推理 30 题',done:false},{id:3,area:'health',text:'运动 30 分钟',done:false},{id:4,area:'life',text:'整理今天的待办',done:false}],plans:[{id:101,parent:null,level:'month',title:'教综：完成心理学部分'},{id:102,parent:101,level:'week',title:'第1周：普通心理学第1～3章'},{id:103,parent:102,level:'day',title:'今天：感觉、知觉、注意'},{id:104,parent:103,level:'task',title:'感觉与知觉'}]};let data=JSON.parse(localStorage.getItem(K)||'null')||D;if(old&&!localStorage.getItem(K)){data.tasks=old.tasks||data.tasks;data.plans=old.plans||data.plans}function save(){localStorage.setItem(K,JSON.stringify(data));render()}function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function kids(id){return data.modules.filter(x=>x.parent===id)}function mod(id){return data.modules.find(x=>x.id===id)}function root(id){let m=mod(id);while(m&&m.parent)m=mod(m.parent);return m?.id||id}function descendants(id){let a=[id],changed=true;while(changed){changed=false;data.plans.forEach(p=>{if(a.includes(p.parent)&&!a.includes(p.id)){a.push(p.id);changed=true}})}return a}function planProgress(id){let ids=descendants(id),linked=data.tasks.filter(t=>t.planId&&ids.includes(t.planId));if(linked.length)return Math.round(linked.filter(t=>t.done).length/linked.length*100);let leaves=data.plans.filter(p=>ids.includes(p.id)&&p.level==='task');if(!leaves.length)return 0;let done=leaves.filter(p=>data.tasks.some(t=>t.planId===p.id&&t.done)).length;return Math.round(done/leaves.length*100)}function render(){let h=new Date().getHours();hello.textContent=(h<6?'夜深了':h<11?'早上好':h<14?'中午好':h<18?'下午好':'晚上好')+'，晓';date.textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});tasks.innerHTML=data.tasks.length?data.tasks.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${t.id})"><div class="txt">${e(t.text)}${t.planId?'<div class="muted" style="margin:2px 0 0">已关联计划</div>':''}</div><span class="tag">${e(mod(t.area)?.name||'其他')}</span></div>`).join(''):'<div class="muted">今天还没有任务。</div>';[['study','sc'],['health','hc'],['life','lc']].forEach(([a,id])=>{let x=data.tasks.filter(t=>root(t.area)===a);document.getElementById(id).textContent=x.filter(t=>t.done).length+'/'+x.length});let sm=kids('study');studyModules.innerHTML=sm.map(m=>moduleCard(m,true)).join('');otherModules.innerHTML=data.modules.filter(m=>!m.parent&&m.id!=='study').map(m=>moduleCard(m,true)).join('');renderPlans()}function moduleCard(m,deep){let cs=kids(m.id);return `<button class="module" onclick="openModule('${m.id}')"><strong>${e(m.icon)} ${e(m.name)}</strong><div class="muted" style="margin:4px 0 0">${e(m.desc)}</div>${cs.length&&deep?`<div class="chips">${cs.map(c=>`<span class="chip">${e(c.icon)} ${e(c.name)}</span>`).join('')}</div>`:''}</button>`}function renderPlans(){let ms=data.plans.filter(p=>p.level==='month');planTree.innerHTML=ms.length?ms.map(planHTML).join(''):'<div class="card muted">还没有月计划。</div>';let days=data.plans.filter(p=>p.level==='day'),active=days[0];todayPlans.innerHTML=active?`<div class="node"><div class="head"><div class="txt">${e(active.title)}</div><span class="tag">${planProgress(active.id)}%</span></div><div class="progress"><div class="fill" style="width:${planProgress(active.id)}%"></div></div>${data.plans.filter(p=>p.parent===active.id).map(p=>`<div class="task"><div class="txt">${e(p.title)}</div><button class="mini" onclick="makeTask(${p.id})">加入今日</button></div>`).join('')}</div>`:'<div class="muted">还没有日计划。</div>'}function planHTML(p){let cs=data.plans.filter(x=>x.parent===p.id),labels={month:'月',week:'周',day:'日',task:'知识点'},next={month:'week',week:'day',day:'task'};let q=planProgress(p.id);return `<div class="tree"><div class="node"><div class="head"><div class="txt"><span class="tag">${labels[p.level]}</span> ${e(p.title)}</div><span class="tag">${q}%</span><div class="actions"><button class="mini" onclick="editPlan(${p.id})">✎</button><button class="mini" onclick="delPlan(${p.id})">×</button></div></div><div class="progress"><div class="fill" style="width:${q}%"></div></div>${p.level==='task'?`<button class="mini" style="margin-top:8px" onclick="makeTask(${p.id})">＋ 加入今日任务</button>`:`<button class="mini" style="margin-top:8px" onclick="planForm(${p.id},'${next[p.level]}')">＋ 继续拆分</button>`}</div>${cs.map(planHTML).join('')}</div>`}function go(el,id){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));el.classList.add('on');document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}function toggle(id){let t=data.tasks.find(x=>x.id===id);t.done=!t.done;save()}function show(x){modal.innerHTML=x;mbg.classList.add('on')}function closeM(){mbg.classList.remove('on')}function taskForm(area='civil',planId=''){show(`<h3>添加今日任务</h3><input id="tt" placeholder="今天要完成什么"><label class="muted">所属模块</label><select id="ta">${data.modules.filter(m=>m.id!=='study'&&kids(m.id).length===0).map(m=>`<option value="${m.id}" ${m.id===area?'selected':''}>${e(m.icon+' '+m.name)}</option>`).join('')}</select><input id="tp" type="hidden" value="${planId}"><div class="row"><button class="mini" onclick="closeM()">取消</button><button class="btn" onclick="saveTask()">保存</button></div>`)}function saveTask(){if(!tt.value.trim())return;data.tasks.push({id:Date.now(),area:ta.value,text:tt.value.trim(),done:false,planId:tp.value?Number(tp.value):null});save();closeM()}function makeTask(id){let p=data.plans.find(x=>x.id===id);if(data.tasks.some(t=>t.planId===id)){alert('这个知识点已经加入今日任务');return}let area='teacher';taskForm(area,id);setTimeout(()=>tt.value=p.title,0)}function planForm(parent,level){let l={month:'月计划',week:'周计划',day:'日计划',task:'知识点'}[level];show(`<h3>新建${l}</h3><input id="pt" placeholder="输入${l}内容"><div class="row"><button class="mini" onclick="closeM()">取消</button><button class="btn" onclick="savePlan(${parent===null?'null':parent},'${level}')">保存</button></div>`)}function savePlan(parent,level){if(!pt.value.trim())return;data.plans.push({id:Date.now(),parent,level,title:pt.value.trim()});save();closeM()}function editPlan(id){let p=data.plans.find(x=>x.id===id),n=prompt('修改计划',p.title);if(n&&n.trim()){p.title=n.trim();save()}}function delPlan(id){if(!confirm('删除这项计划以及它下面的计划？'))return;let ids=descendants(id);data.plans=data.plans.filter(p=>!ids.includes(p.id));data.tasks.forEach(t=>{if(ids.includes(t.planId))t.planId=null});save()}function openModule(id){let m=mod(id),cs=kids(id);if(cs.length){show(`<h3>${e(m.icon)} ${e(m.name)}</h3><div class="muted">${e(m.desc)}</div>${cs.map(c=>moduleCard(c,false)).join('')}<button class="mini" style="width:100%" onclick="moduleForm('${id}')">＋ 添加子模块</button>`);return}let ts=data.tasks.filter(t=>t.area===id);show(`<h3>${e(m.icon)} ${e(m.name)}</h3><div class="muted">${e(m.desc)}</div>${ts.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${t.id});openModule('${id}')"><div class="txt">${e(t.text)}</div></div>`).join('')||'<div class="muted">暂无任务</div>'}<button class="btn" style="width:100%;margin-top:10px" onclick="taskForm('${id}')">＋ 添加任务</button>`)}function moduleForm(parent){show(`<h3>${parent?'添加子模块':'添加领域'}</h3><input id="mi" value="✨" placeholder="图标"><input id="mn" placeholder="名称"><input id="md" placeholder="说明"><div class="row"><button class="mini" onclick="closeM()">取消</button><button class="btn" onclick="saveModule('${parent||''}')">保存</button></div>`)}function saveModule(parent){if(!mn.value.trim())return;data.modules.push({id:'m'+Date.now(),parent:parent||null,icon:mi.value||'✨',name:mn.value.trim(),desc:md.value.trim()});save();closeM()}function editModules(){show(`<h3>编辑工作台</h3><div class="muted">当前支持改名和新增模块，下一版继续加入拖拽、隐藏和归档。</div>${data.modules.map((m,i)=>`<div class="task"><div class="txt">${e(m.icon)} ${e(m.name)}</div><button class="mini" onclick="rename(${i})">改名</button>${m.id!=='study'&&m.id!=='health'&&m.id!=='life'?`<button class="mini" onclick="removeModule(${i})">删除</button>`:''}</div>`).join('')}<button class="btn" style="width:100%;margin-top:10px" onclick="moduleForm(null)">＋ 添加领域</button>`)}function rename(i){let n=prompt('新的名称',data.modules[i].name);if(n&&n.trim()){data.modules[i].name=n.trim();save();editModules()}}function removeModule(i){let m=data.modules[i];if(kids(m.id).length){alert('请先删除它下面的子模块');return}if(!confirm('删除这个模块？'))return;data.tasks=data.tasks.filter(t=>t.area!==m.id);data.modules.splice(i,1);save();editModules()}render()</script></body></html>
