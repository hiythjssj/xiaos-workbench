name: Attach daily execution redesign
on:
  push:
    branches: [main]
    paths: ['daily-execution-redesign.js','.github/workflows/attach-daily-execution.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8');tag='<script src="./daily-execution-redesign.js?v=1"></script>'
          if tag not in s:p.write_text(s.replace('</body>',tag+'</body>'),encoding='utf-8')
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -m "Attach redesigned daily execution" && git push