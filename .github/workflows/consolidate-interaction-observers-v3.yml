name: Consolidate interaction observers v3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['interaction-consolidated-v3.js','.github/workflows/consolidate-interaction-observers-v3.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          for name in ['interaction-hotfix-v2.js','ui-safety-core-v2.js','interaction-consolidated-v3.js']:
              s=re.sub(r'<script src="\./'+re.escape(name)+r'(?:\?v=\d+)?"></script>','',s)
          tag='<script src="./interaction-consolidated-v3.js?v=1"></script>'
          anchor='<script src="./interaction-registry-v2.js?v=2"></script>'
          s=s.replace(anchor,tag+anchor) if anchor in s else s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -m "Consolidate interaction observers" && git push