name: Attach workbench upgrades
on:
  push:
    branches: [main]
    paths:
      - 'plan-upgrade.js'
      - 'current-affairs.js'
      - 'study-upgrade.js'
      - 'study-sync.js'
      - 'psychology-hub.js'
      - 'psychology-paper.js'
      - 'psychology-network.js'
      - 'psychology-review.js'
      - 'daily-cockpit.js'
      - 'weekly-review.js'
      - 'stability.js'
      - 'data-manager.js'
      - 'cloud-sync.js'
      - 'civil-service-hub.js'
      - 'shenlun-upgrade.js'
      - '.github/workflows/attach-plan-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach upgrade scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for v in ['1','2','3']:
              s=s.replace(f'<script src="./civil-service-hub.js?v={v}"></script>','<script src="./civil-service-hub.js?v=4"></script>')
          s=s.replace('<script src="./current-affairs.js?v=1"></script>','<script src="./current-affairs.js?v=2"></script>')
          s=s.replace('<script src="./shenlun-upgrade.js?v=1"></script>','<script src="./shenlun-upgrade.js?v=2"></script>')
          tags=['<script src="./plan-upgrade.js?v=2"></script>','<script src="./current-affairs.js?v=2"></script>','<script src="./study-upgrade.js?v=1"></script>','<script src="./study-sync.js?v=1"></script>','<script src="./psychology-hub.js?v=1"></script>','<script src="./psychology-paper.js?v=1"></script>','<script src="./psychology-network.js?v=1"></script>','<script src="./psychology-review.js?v=1"></script>','<script src="./daily-cockpit.js?v=1"></script>','<script src="./weekly-review.js?v=1"></script>','<script src="./stability.js?v=1"></script>','<script src="./data-manager.js?v=2"></script>','<script src="./cloud-sync.js?v=4"></script>','<script src="./civil-service-hub.js?v=4"></script>','<script src="./shenlun-upgrade.js?v=2"></script>']
          for tag in tags:
              if tag not in s: s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit attachment
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Attach workbench upgrade scripts"
          git push