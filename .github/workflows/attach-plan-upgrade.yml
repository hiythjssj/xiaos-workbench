name: Attach workbench upgrades
on:
  push:
    branches: [main]
    paths:
      - 'plan-upgrade.js'
      - 'current-affairs.js'
      - '.github/workflows/attach-plan-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach upgrade scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=['<script src="./plan-upgrade.js?v=2"></script>','<script src="./current-affairs.js?v=1"></script>']
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit attachment
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Attach workbench upgrade scripts"
          git push