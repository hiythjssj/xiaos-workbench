name: Attach workbench upgrades
on:
  push:
    branches: [main]
    paths:
      - 'plan-upgrade.js'
      - 'plan-progress-sync.js'
      - 'current-affairs.js'
      - 'study-upgrade.js'
      - 'study-sync.js'
      - 'teacher-complete.js'
      - 'psychology-hub.js'
      - 'psychology-paper.js'
      - 'psychology-network.js'
      - 'psychology-review.js'
      - 'psychology-complete.js'
      - 'daily-cockpit.js'
      - 'weekly-review.js'
      - 'learning-command-center.js'
      - 'progress-calendar.js'
      - 'runtime-guard.js'
      - 'workbench-finish.js'
      - 'responsive-ui.js'
      - 'visual-polish.js'
      - 'stability.js'
      - 'data-manager.js'
      - 'cloud-sync.js'
      - 'civil-service-hub.js'
      - 'shenlun-upgrade.js'
      - 'civil-weekly-report.js'
      - 'civil-dashboard.js'
      - 'civil-goals.js'
      - 'civil-mock-review.js'
      - 'civil-mock-detail.js'
      - 'civil-mock-trends.js'
      - 'civil-complete.js'
      - '.github/workflows/attach-plan-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach upgrade scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={'<script src="./current-affairs.js?v=1"></script>':'<script src="./current-affairs.js?v=2"></script>','<script src="./shenlun-upgrade.js?v=1"></script>':'<script src="./shenlun-upgrade.js?v=3"></script>','<script src="./shenlun-upgrade.js?v=2"></script>':'<script src="./shenlun-upgrade.js?v=3"></script>','<script src="./civil-dashboard.js?v=1"></script>':'<script src="./civil-dashboard.js?v=5"></script>','<script src="./civil-dashboard.js?v=2"></script>':'<script src="./civil-dashboard.js?v=5"></script>','<script src="./civil-dashboard.js?v=3"></script>':'<script src="./civil-dashboard.js?v=5"></script>','<script src="./civil-dashboard.js?v=4"></script>':'<script src="./civil-dashboard.js?v=5"></script>'}
          for old,new in replacements.items(): s=s.replace(old,new)
          for v in ['1','2','3']: s=s.replace(f'<script src="./civil-service-hub.js?v={v}"></script>','<script src="./civil-service-hub.js?v=4"></script>')
          tags=['plan-upgrade.js?v=2','plan-progress-sync.js?v=1','current-affairs.js?v=2','study-upgrade.js?v=1','study-sync.js?v=1','teacher-complete.js?v=1','psychology-hub.js?v=1','psychology-paper.js?v=1','psychology-network.js?v=1','psychology-review.js?v=1','psychology-complete.js?v=1','daily-cockpit.js?v=1','weekly-review.js?v=1','learning-command-center.js?v=1','stability.js?v=1','data-manager.js?v=2','cloud-sync.js?v=4','civil-service-hub.js?v=4','shenlun-upgrade.js?v=3','civil-weekly-report.js?v=1','civil-goals.js?v=1','civil-dashboard.js?v=5','civil-mock-review.js?v=1','civil-mock-detail.js?v=1','civil-mock-trends.js?v=1','civil-complete.js?v=1','runtime-guard.js?v=1','workbench-finish.js?v=1','progress-calendar.js?v=2','responsive-ui.js?v=1','visual-polish.js?v=1']
          for src in tags:
              tag=f'<script src="./{src}"></script>'
              if tag not in s:s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit attachment
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Attach workbench upgrade scripts"
          git push