name: Attach plan upgrade
on:
  push:
    branches: [main]
    paths:
      - 'plan-upgrade.js'
      - '.github/workflows/attach-plan-upgrade.yml'
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach plan upgrade script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./plan-upgrade.js?v=2"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit attachment
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Attach linked plan upgrade"
          git push