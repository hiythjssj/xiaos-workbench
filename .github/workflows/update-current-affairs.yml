name: Update current affairs
on:
  schedule:
    - cron: '15 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build daily feed
        run: python scripts/update_current_affairs.py
      - name: Commit feed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-affairs.json
          git commit -m "Update daily current affairs"
          git push