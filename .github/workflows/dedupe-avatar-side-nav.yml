name: Dedupe avatar side nav include
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/dedupe-avatar-side-nav.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=list(re.finditer(r'<script src="\./avatar-side-nav\.js\?v=\d+"></script>',s))
          if len(tags)>1:
              keep=tags[0].group(0)
              s=re.sub(r'<script src="\./avatar-side-nav\.js\?v=\d+"></script>','',s)
              anchor='<script src="./home-command-center.js?v=1"></script>'
              s=s.replace(anchor,keep+anchor,1) if anchor in s else s.replace('</body>',keep+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -m "Remove duplicate avatar side nav include" && git push