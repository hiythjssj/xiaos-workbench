name: Attach study domain scope v3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['domain-scope-v3.js','.github/workflows/attach-domain-scope-v3.yml']
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8');s=re.sub(r'<script src="\./domain-scope-v3\.js(?:\?v=\d+)?"></script>','',s);tag='<script src="./domain-scope-v3.js?v=1"></script>';anchor='<script src="./workbench-router-v2.js?v=1"></script>';s=s.replace(anchor,tag+anchor) if anchor in s else s.replace('</body>',tag+'</body>');p.write_text(s,encoding='utf-8')
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html && git commit -m "Attach strict study domain scope" && git push