name: Attach dashboard redesign
on:
  push:
    branches: [main]
    paths:
      - 'dashboard-redesign.js'
      - '.github/workflows/attach-dashboard-redesign.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach dashboard redesign
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./dashboard-redesign.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Attach redesigned dashboard"
          git push